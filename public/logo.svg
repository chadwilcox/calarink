<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Calarink">
  <title>Calarink</title>
  <defs>
    <linearGradient id="cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd8"/>
      <stop offset="1" stop-color="#17498a"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecfb"/>
    </linearGradient>
  </defs>
  <!-- calendar page -->
  <rect x="3" y="8" width="42" height="37" rx="10" fill="url(#cal)"/>
  <!-- binder rings -->
  <rect x="12.5" y="2.5" width="5" height="11" rx="2.5" fill="#17498a" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="30.5" y="2.5" width="5" height="11" rx="2.5" fill="#17498a" stroke="#ffffff" stroke-width="1.5"/>
  <!-- the rink: boards, blue lines, red line, center circle -->
  <rect x="8" y="17.5" width="32" height="22.5" rx="8" fill="url(#ice)"/>
  <rect x="16.6" y="17.5" width="1.8" height="22.5" fill="#2f7fd8"/>
  <rect x="29.6" y="17.5" width="1.8" height="22.5" fill="#2f7fd8"/>
  <rect x="23.1" y="17.5" width="1.8" height="22.5" fill="#e23b48"/>
  <circle cx="24" cy="28.75" r="4.6" fill="none" stroke="#2f7fd8" stroke-width="1.5"/>
  <circle cx="24" cy="28.75" r="1.3" fill="#e23b48"/>
</svg>
