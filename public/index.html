<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calarink</title>
  <meta name="description" content="Public skate, stick & puck, shinny and freestyle ice times from every rink, in one list.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <a href="./" class="brand-mark" aria-label="Calarink home"><img src="logo.svg" alt="" width="42" height="42"></a>
        <h1 class="wordmark">Cala<span>rink</span></h1>
      </div>
      <div class="top-actions">
        <label class="state-pick" title="State">
          <span class="visually-hidden">State</span>
          <select id="usState"></select>
        </label>
        <button id="refresh" class="btn" title="Re-pull every rink now">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
          <span>Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap layout">
    <aside class="filters" aria-label="Filters">
      <section>
        <h2>Session type</h2>
        <div id="types" class="chips"></div>
      </section>
      <section>
        <h2>When</h2>
        <div id="range" class="seg">
          <button data-days="1">Today</button>
          <button data-days="7">7 days</button>
          <button data-days="14">14 days</button>
          <button data-days="30">30 days</button>
          <button data-days="120">All</button>
        </div>
        <div class="dow" id="dow" aria-label="Days of week"></div>
      </section>
      <section>
        <h2>Region</h2>
        <select id="region"><option value="">All regions</option></select>
      </section>
      <section>
        <h2 class="row-between">Rinks <span class="linkbtns"><button class="linkbtn" id="rinksAll">all</button><button class="linkbtn" id="rinksNone">none</button></span></h2>
        <div id="rinkList" class="rink-list"></div>
      </section>
    </aside>

    <section class="results" aria-live="polite">
      <div id="summary" class="summary"></div>
      <div id="agenda"></div>
      <section class="direct" id="directSection" hidden>
        <h2>Check these rinks directly</h2>
        <p class="muted">These rinks post schedules as PDFs, on Facebook, or in booking widgets that can't be read automatically.</p>
        <div id="direct" class="cards"></div>
      </section>
    </section>
  </main>

  <footer class="wrap foot muted">
    <strong>Calarink</strong> · Schedules are pulled from each rink's own website and change often. Confirm with the rink before you drive.
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
