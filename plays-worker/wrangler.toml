# Top Plays API. Deploy from this folder: npx wrangler deploy   (setup steps: README, "Top Plays")
name = "calarink-plays"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# More specific than calarink-geo's calarink.com/*, so it wins for these addresses.
routes = [
  { pattern = "calarink.com/plays-api/*", zone_name = "calarink.com" },
]

[vars]
MAIL_FROM = "Calarink <noreply@calarink.com>"
# Secrets (npx wrangler secret put ...): ADMIN_EMAIL, RESEND_API_KEY, IP_SALT

[triggers]
crons = ["20 9 * * *"] # daily cleanup, early morning Eastern

[[d1_databases]]
binding = "DB"
database_name = "calarink-plays"
database_id = "974669ea-6916-44b4-88a8-bf3750378a75"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "calarink-clips"
