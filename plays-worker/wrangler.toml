# Top Plays API. Deploy from this folder: npx wrangler deploy   (setup steps: README, "Top Plays")
name = "calarink-plays"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# More specific than calarink-geo's calarink.com/*, so it wins for these addresses.
routes = [
  { pattern = "calarink.com/plays-api/*", zone_name = "calarink.com" },
]

[vars]
MAIL_FROM = "noreply@calarink.com"
# Secrets (npx wrangler secret put ...): ADMIN_EMAIL, IP_SALT, GITHUB_TOKEN (starts site updates)

# Per network; a full page of clips and posters is well under this
[[ratelimits]]
name = "LIMIT"
namespace_id = "5178"
simple = { limit = 600, period = 60 }

# No single request may run away (it normally needs a few ms)
[limits]
cpu_ms = 200

# Cloudflare Email Sending, enabled for calarink.com
[[send_email]]
name = "EMAIL"

[triggers]
crons = ["20 12 * * *", "7,37 * * * *"] # daily cleanup and emails, morning Eastern; site updates (UPDATE_CRON)

[[d1_databases]]
binding = "DB"
database_name = "calarink-plays"
database_id = "974669ea-6916-44b4-88a8-bf3750378a75"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "calarink-clips"

# Clip screening (src/screen.js): stills from the stored video, and a vision model
[ai]
binding = "AI"
remote = true

[media]
binding = "MEDIA"
remote = true
